syntax = "proto2";

package mixxx.track.io;

option optimize_for = LITE_RUNTIME;

enum Source {
  ANALYZER = 0;
  FILE_METADATA = 1;
  USER = 2;
}

message Beat {
  optional int32 frame_position = 1;
  optional bool enabled = 2 [ default = true ];
  optional Source source = 3 [ default = ANALYZER ];
}

message Bpm {
  optional double bpm = 1;
  optional Source source = 2 [ default = ANALYZER ];
}

message BeatMap {
  repeated Beat beat = 1;
  // Index of a downbeat (the first beat of a bar and of a phrase), counted
  // from the first entry of `beat`. May be negative. Unset if the downbeat
  // has not been set by the user.
  optional int32 downbeat_index = 2;
}

message BeatGrid {
  optional Bpm bpm = 1;
  optional Beat first_beat = 2;
  // Index of a downbeat (the first beat of a bar and of a phrase), counted
  // in beats from `first_beat`. May be negative. Unset if the downbeat has
  // not been set by the user.
  optional int32 downbeat_index = 3;
}
